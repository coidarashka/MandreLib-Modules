name: Build Ultimate CFFI 2.0 (The Final Victory)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake libtool wget unzip zip patchelf
          pip install wheel setuptools pycparser

      - name: Download & Setup Android NDK (r26b)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

      - name: Build LibFFI (Static)
        run: |
          NDK=$ANDROID_NDK_HOME
          TARGET_HOST=aarch64-linux-android
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TARGET_HOST}30-clang
          WORKDIR=$PWD/build_work
          FFI_INSTALL=$WORKDIR/libffi_install
          mkdir -p $WORKDIR $FFI_INSTALL
          cd $WORKDIR
          wget https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
          tar xzf libffi-3.4.6.tar.gz
          cd libffi-3.4.6
          ./configure --host=${TARGET_HOST} --prefix=${FFI_INSTALL} --disable-shared --enable-static
          make -j$(nproc)
          make install
          echo "FFI_INSTALL=$FFI_INSTALL" >> $GITHUB_ENV

      - name: Build and Patch CFFI Wheel
        run: |
          NDK=$ANDROID_NDK_HOME
          TARGET_HOST=aarch64-linux-android
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TARGET_HOST}30-clang
          WORKDIR=$PWD/build_work
          FFI_INSTALL=${{ env.FFI_INSTALL }}
          
          echo ">>> Downloading CFFI Sources..."
          cd $WORKDIR
          wget https://files.pythonhosted.org/packages/source/c/cffi/cffi-2.0.0.tar.gz
          tar xzf cffi-2.0.0.tar.gz
          cd cffi-2.0.0

          # =========================================================
          # МЕГА-ХАК: ВШИВАЕМ СИМВОЛЫ ПРЯМО В ИСХОДНИКИ
          # Это заставит библиотеку использовать свои внутренние 
          # указатели вместо того, чтобы искать stderr в системе.
          # =========================================================
          echo ">>> Injecting Android Fix..."
          sed -i '1i void* stderr = 0; void* stdout = 0; void* stdin = 0;' c/_cffi_backend.c
          
          export PKG_CONFIG_PATH=${FFI_INSTALL}/lib/pkgconfig
          export CFLAGS="-DANDROID -fPIC"
          export LDFLAGS="-L${FFI_INSTALL}/lib -Wl,-allow-shlib-undefined"
          export LDSHARED="$CC -shared $LDFLAGS"
          export _PYTHON_HOST_PLATFORM="linux-aarch64"
          
          echo ">>> Compiling Wheel..."
          python3 setup.py bdist_wheel
          
          cd dist
          WHEEL_FILE=$(ls cffi-*.whl)
          unzip -q $WHEEL_FILE -d unpacked
          cd unpacked
          
          SO_FILE=$(find . -name "_cffi_backend*.so")
          
          # 1. Очищаем мусорные зависимости (теперь они не нужны, всё внутри)
          patchelf --remove-needed libpthread.so.0 $SO_FILE || true
          patchelf --remove-needed libc.so.6 $SO_FILE || true
          
          # 2. УДАЛЯЕМ СЕКЦИЮ ВЕРСИЙ СИМВОЛОВ (ОБЯЗАТЕЛЬНО)
          patchelf --remove-section .gnu.version_r $SO_FILE || true
          
          mv $SO_FILE _cffi_backend.so
          
          # Проверка
          echo "Final SO Check:"
          patchelf --print-needed _cffi_backend.so
          nm -D _cffi_backend.so | grep -E "stderr|stdout|stdin"
          
          # 3. Запаковываем
          zip -q -r ../../fixed_cffi.whl *
          cd ../..
          mv fixed_cffi.whl cffi-2.0.0-cp311-cp311-android_30_arm64_v8a.whl
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp *.whl $GITHUB_WORKSPACE/output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cffi-android-wheel
          path: output/*.whl
