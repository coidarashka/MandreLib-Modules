name: Build Ultimate CFFI 2.0 (Patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # patchelf - утилита для аппаратной модификации .so файлов!
          sudo apt-get install -y build-essential automake libtool wget unzip zip patchelf
          pip install wheel setuptools

      - name: Download & Setup Android NDK (r26b)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

      - name: Build LibFFI
        run: |
          NDK=$ANDROID_NDK_HOME
          API=30
          TARGET_HOST=aarch64-linux-android
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TARGET_HOST}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET_HOST}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          WORKDIR=$PWD/build_work
          FFI_INSTALL=$WORKDIR/libffi_install
          mkdir -p $WORKDIR $FFI_INSTALL
          
          echo ">>> Building libffi..."
          cd $WORKDIR
          wget https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
          tar xzf libffi-3.4.6.tar.gz
          cd libffi-3.4.6
          ./configure --host=${TARGET_HOST} --prefix=${FFI_INSTALL} --disable-shared --enable-static
          make -j$(nproc)
          make install

      - name: Build and Patch CFFI Wheel
        run: |
          NDK=$ANDROID_NDK_HOME
          API=30
          TARGET_HOST=aarch64-linux-android
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TARGET_HOST}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET_HOST}${API}-clang++
          export LDSHARED="$CC -shared"
          
          WORKDIR=$PWD/build_work
          FFI_INSTALL=$WORKDIR/libffi_install
          
          export PKG_CONFIG_PATH=${FFI_INSTALL}/lib/pkgconfig
          export CFLAGS="-I${FFI_INSTALL}/include -fPIC"
          export LDFLAGS="-L${FFI_INSTALL}/lib"
          export _PYTHON_HOST_PLATFORM="linux-aarch64"
          
          echo ">>> Building CFFI..."
          cd $WORKDIR
          pip wheel cffi==2.0.0 --no-deps -w dist
          
          echo ">>> Magic Unpack and Patch..."
          cd dist
          wheel unpack cffi-*.whl -d unpacked
          cd unpacked/cffi-*
          
          # Находим .so файл
          SO_FILE=$(find . -name "_cffi_backend*.so")
          echo "Found SO file: $SO_FILE"
          
          # Переименовываем в чистое имя
          mv $SO_FILE _cffi_backend.so
          
          # === САМОЕ ГЛАВНОЕ: ВШИВАЕМ ПИТОН В БИНАРНИК ===
          patchelf --add-needed libpython3.11.so _cffi_backend.so
          
          cd ../..
          rm *.whl
          
          # Запаковываем обратно (хэши пересчитаются автоматически!)
          wheel pack unpacked/cffi-* -d .
          
          # Меняем имя колеса на Android формат
          mv cffi-*.whl cffi-2.0.0-cp311-cp311-android_30_arm64_v8a.whl
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp *.whl $GITHUB_WORKSPACE/output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cffi-android-wheel
          path: output/*.whl
