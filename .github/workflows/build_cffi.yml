name: Build Ultimate CFFI 2.0 (The Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake libtool wget unzip zip patchelf
          pip install wheel setuptools pycparser

      - name: Download & Setup Android NDK (r26b)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

      - name: Build LibFFI (Static)
        run: |
          NDK=$ANDROID_NDK_HOME
          TARGET_HOST=aarch64-linux-android
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TARGET_HOST}30-clang
          WORKDIR=$PWD/build_work
          FFI_INSTALL=$WORKDIR/libffi_install
          mkdir -p $WORKDIR $FFI_INSTALL
          cd $WORKDIR
          wget https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz
          tar xzf libffi-3.4.6.tar.gz
          cd libffi-3.4.6
          ./configure --host=${TARGET_HOST} --prefix=${FFI_INSTALL} --disable-shared --enable-static
          make -j$(nproc)
          make install
          echo "FFI_INSTALL=$FFI_INSTALL" >> $GITHUB_ENV

      - name: Build and Patch CFFI Wheel
        run: |
          NDK=$ANDROID_NDK_HOME
          TARGET_HOST=aarch64-linux-android
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TARGET_HOST}30-clang
          WORKDIR=$PWD/build_work
          FFI_INSTALL=${{ env.FFI_INSTALL }}
          
          # =========================================================
          # ОБМАНКА №1: Создаем dummy libpython с нужными символами
          # =========================================================
          mkdir -p $WORKDIR/dummy_lib
          cat << 'EOF' > $WORKDIR/dummy_lib/dummy.c
          #include <stdio.h>
          void* stderr; void* stdout; void* stdin;
          void PyExc_ImportError() {}
          void PyExc_RuntimeError() {}
          EOF
          $CC -shared $WORKDIR/dummy_lib/dummy.c -o $WORKDIR/dummy_lib/libpython3.11.so
          
          export PKG_CONFIG_PATH=${FFI_INSTALL}/lib/pkgconfig
          export CFLAGS="-DANDROID -fPIC"
          export LDFLAGS="-L${FFI_INSTALL}/lib -L$WORKDIR/dummy_lib -lpython3.11 -Wl,-allow-shlib-undefined"
          export LDSHARED="$CC -shared $LDFLAGS"
          export _PYTHON_HOST_PLATFORM="linux-aarch64"
          
          echo ">>> Building CFFI..."
          cd $WORKDIR
          pip wheel cffi==2.0.0 --no-deps -w dist
          
          echo ">>> Patching..."
          cd dist
          wheel unpack cffi-*.whl -d unpacked
          cd unpacked/cffi-*
          
          SO_FILE=$(find . -name "_cffi_backend*.so")
          
          # Убираем зависимости от Linux
          patchelf --replace-needed libpthread.so.0 libc.so $SO_FILE || true
          patchelf --replace-needed libc.so.6 libc.so $SO_FILE || true
          
          # Вшиваем зависимость от Питона (откуда он возьмет stderr)
          patchelf --add-needed libpython3.11.so $SO_FILE
          
          # КРИТИЧНО: Удаляем секцию symbol versioning (она ломает Android)
          # Это удаляет те самые verneed[0], на которые ругался Android
          patchelf --remove-section .gnu.version_r $SO_FILE || true
          
          mv $SO_FILE _cffi_backend.so
          
          # Тест
          echo "Final Dependencies:"
          patchelf --print-needed _cffi_backend.so
          
          # Запаковываем
          cd ../..
          wheel pack unpacked/cffi-* -d .
          mv cffi-2.0.0-*.whl cffi-2.0.0-cp311-cp311-android_30_arm64_v8a.whl
          
          mkdir -p $GITHUB_WORKSPACE/output
          cp *.whl $GITHUB_WORKSPACE/output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cffi-android-wheel
          path: output/*.whl
