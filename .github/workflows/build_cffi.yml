name: Build CFFI 2.0 for Android (Chaquopy)

on:
  workflow_dispatch: # Позволяет запускать сборку кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (Optional)
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake libtool wget unzip pkg-config

      - name: Download & Setup Android NDK (r26b)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

      - name: Build LibFFI (Static) & CFFI Wheel
        run: |
          # --- ПЕРЕМЕННЫЕ ---
          NDK=$ANDROID_NDK_HOME
          API=30
          TARGET_HOST=aarch64-linux-android
          LIBFFI_VER=3.4.6
          CFFI_VER=2.0.0
          CHAQUO_TAG=cp311-cp311-android_30_arm64_v8a
          
          # Настройка Toolchain (Clang от Android NDK)
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/${TARGET_HOST}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET_HOST}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          # КРИТИЧЕСКИ ВАЖНЫЙ ФИКС ЛИНКОВЩИКА ДЛЯ PYTHON:
          export LDSHARED="$CC -shared"
          
          # Указываем Python, что мы кросс-компилируем:
          export _PYTHON_HOST_PLATFORM=linux-aarch64
          
          # Папки
          WORKDIR=$PWD/build_work
          FFI_INSTALL=$WORKDIR/libffi_install
          mkdir -p $WORKDIR $FFI_INSTALL
          
          # 1. Сборка LIBFFI
          echo ">>> Building libffi..."
          cd $WORKDIR
          wget https://github.com/libffi/libffi/releases/download/v${LIBFFI_VER}/libffi-${LIBFFI_VER}.tar.gz
          tar xzf libffi-${LIBFFI_VER}.tar.gz
          cd libffi-${LIBFFI_VER}
          ./configure --host=${TARGET_HOST} --prefix=${FFI_INSTALL} --disable-shared --enable-static
          make -j$(nproc)
          make install
          
          # Настройка флагов для CFFI (Указываем таргет явно)
          export PKG_CONFIG_PATH=${FFI_INSTALL}/lib/pkgconfig
          export CFLAGS="-I${FFI_INSTALL}/include -fPIC -target ${TARGET_HOST}${API}"
          export LDFLAGS="-L${FFI_INSTALL}/lib -target ${TARGET_HOST}${API}"
          
          # 2. Сборка CFFI
          echo ">>> Building CFFI..."
          cd $WORKDIR
          # Ставим зависимости сборки ВРУЧНУЮ
          pip install --upgrade pip setuptools wheel pycparser
          
          # Собираем wheel С ОТКЛЮЧЕННОЙ ИЗОЛЯЦИЕЙ (--no-build-isolation), 
          # чтобы pip не сбросил наши переменные окружения!
          pip wheel cffi==${CFFI_VER} --no-build-isolation --no-binary cffi --no-deps -w ./wheels -v
          
          # 3. Перепаковка и переименование
          echo ">>> Repacking and Renaming..."
          cd ./wheels
          
          # Находим собранный wheel
          WHEEL_FILE=$(ls cffi-*.whl | head -n 1)
          
          # Распаковываем
          unzip -q $WHEEL_FILE -d tmp_wheel
          
          # Ищем библиотеку (она будет иметь длинный суффикс)
          SO_FILE=$(find tmp_wheel -name "_cffi_backend*.so" | head -n 1)
          if [ -n "$SO_FILE" ]; then
            echo "Renaming $SO_FILE to _cffi_backend.so for Chaquopy compatibility..."
            mv $SO_FILE $(dirname $SO_FILE)/_cffi_backend.so
          else
            echo "::error::Could not find ANY _cffi_backend.so inside the wheel!"
            exit 1
          fi
          
          # Запаковываем обратно
          rm $WHEEL_FILE
          cd tmp_wheel
          zip -qr ../$WHEEL_FILE .
          cd ..
          rm -rf tmp_wheel
          
          # Переименовываем под Android стандарты
          mv $WHEEL_FILE cffi-${CFFI_VER}-${CHAQUO_TAG}.whl
          ls -la
          
          # Выносим результат в корень
          mkdir -p $GITHUB_WORKSPACE/output
          cp *.whl $GITHUB_WORKSPACE/output/

      - name: Verify Built Wheel (Sanity Check)
        run: |
          echo ">>> Starting sanity checks on the built binary..."
          cd $GITHUB_WORKSPACE/output
          
          WHEEL_FILE=$(ls cffi-*.whl | head -n 1)
          echo "Target wheel: $WHEEL_FILE"
          
          unzip -q $WHEEL_FILE -d wheel_content
          
          # Мы переименовали файл на предыдущем шаге, так что ищем точное короткое имя:
          SO_FILE=$(find wheel_content -name "_cffi_backend.so" | head -n 1)
          if [ -z "$SO_FILE" ]; then
            echo "::error::_cffi_backend.so NOT FOUND in the wheel!"
            exit 1
          fi
          echo "Found compiled object: $SO_FILE"
          
          READELF=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          
          # ТЕСТ 1: Проверка архитектуры (должно быть AArch64)
          ARCH=$($READELF -h $SO_FILE | grep "Machine:")
          echo "Architecture: $ARCH"
          if [[ "$ARCH" != *"AArch64"* ]]; then
            echo "::error::Wrong architecture! Expected AArch64."
            exit 1
          fi
          
          # ТЕСТ 2: Проверка зависимостей (НЕ должно быть libc.so.6)
          DEPS=$($READELF -d $SO_FILE | grep "NEEDED" || true)
          echo -e "\nDynamic Dependencies:"
          echo "$DEPS"
          
          if echo "$DEPS" | grep -q "libc.so.6"; then
            echo "::error::FATAL! glibc (libc.so.6) dependency found. Cross-compilation failed to link against Android Bionic."
            exit 1
          fi
          
          if echo "$DEPS" | grep -q "libc.so"; then
            echo "OK: Android Bionic libc.so found (this is correct)."
          fi
          
          echo -e "\n>>> ALL CHECKS PASSED. The wheel is ready for Android! 🎉"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cffi-android-wheel
          path: output/*.whl
